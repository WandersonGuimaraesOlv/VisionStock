# Trechos para o server {} do Nginx do servidor (o mesmo site que publica os sistemas por caminho).

# 1) Painel e login, publicados em /acesso/
location ^~ /acesso/ {
    proxy_pass http://127.0.0.1:8093;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# 2) Consulta interna feita pelo Nginx antes de abrir cada sistema
location ~ ^/_acesso/([a-z0-9-]+)$ {
    internal;
    proxy_pass http://127.0.0.1:8093/acesso/api/verificar/$1;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header X-Original-URI $request_uri;
    proxy_set_header X-Real-IP $remote_addr;
}

# 3) Sem login vai para a tela de entrar; sem permissão vai para o aviso
location @acesso_entrar { return 302 /acesso/entrar?volta=$request_uri; }
location @acesso_negado { return 302 /acesso/sem-acesso; }

