# Nginx do container "web": serve o PWA e repassa /api ao backend de drone (rede interna do Compose).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Vídeos de drone: mesmo limite do backend (LIMITE_UPLOAD_MB)
    client_max_body_size 600m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Upload grande + processamento demorado
        proxy_request_buffering off;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }

    # O Service Worker e o index nunca podem ficar presos em cache, senão o PWA não atualiza
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Arquivos do build têm hash no nome: cache longo
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
