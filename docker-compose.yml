# VisionStock (ALMOX) — sobe frontend (Nginx) + backend de drone (FastAPI) no servidor Linux.
# Uso: cp .env.example .env && (edite o .env) && docker compose up -d --build
name: visionstock

services:
  web:
    build:
      context: .
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY}
        VITE_SUPABASE_TABELA_LEITURAS: ${VITE_SUPABASE_TABELA_LEITURAS:-leituras_almox}
        VITE_API_KEY: ${API_KEY}
    restart: unless-stopped
    depends_on:
      - api
    ports:
      # Só na máquina local por padrão: o proxy HTTPS do servidor (Nginx/Caddy/Traefik) aponta para cá.
      # Para expor direto na rede, troque por "${ALMOX_PORTA:-8080}:80".
      - "127.0.0.1:${ALMOX_PORTA:-8080}:80"

  api:
    build: ./backend
    restart: unless-stopped
    environment:
      API_KEY: ${API_KEY}
      LIMITE_UPLOAD_MB: ${LIMITE_UPLOAD_MB:-600}
      MAX_PROCESSAMENTOS: ${MAX_PROCESSAMENTOS:-1}
    # Sem porta publicada: só o container web acessa
    tmpfs:
      - /tmp
